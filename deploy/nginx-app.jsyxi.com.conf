# Jsyxi Shipping — edge proxy for app.jsyxi.com
#
# This is the §5.7 control 2 boundary: TLS terminates here and plaintext HTTP is
# refused, not silently upgraded, on everything except the ACME challenge.
#
# Install:  /etc/nginx/sites-available/app.jsyxi.com
# Enable:   ln -s ../sites-available/app.jsyxi.com /etc/nginx/sites-enabled/
#
# certbot --nginx rewrites the listen/ssl_certificate lines on first issue;
# provision.sh runs it after this file is in place.

upstream jsyxi_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Shopify signs webhooks over the raw body; never let a proxy rewrite it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.jsyxi.com;

    # Let's Encrypt HTTP-01 stays on :80; everything else is redirected once
    # the certificate exists.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.jsyxi.com;

    ssl_certificate     /etc/letsencrypt/live/app.jsyxi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.jsyxi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Labels and report exports are the large responses here.
    client_max_body_size 25m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    access_log /var/log/nginx/jsyxi-access.log;
    error_log  /var/log/nginx/jsyxi-error.log;

    location = /healthz {
        proxy_pass http://jsyxi_app;
        access_log off;
    }

    location / {
        proxy_pass http://jsyxi_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # main.ts trusts exactly one hop, so this must be set by us, not passed
        # through from the client.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Webhook HMAC (§8.1) is computed over the raw body — no buffering games.
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
