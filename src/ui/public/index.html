<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>Jsyxi Shipping</title>
<!--
  §9.22's typefaces are self-hosted (see @font-face in app.css) — no
  third-party request from a page that renders buyer data, and no external
  dependency for the console to render correctly. Preloaded because both are
  used above the fold.
-->
<link rel="preload" href="/app/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/app/fonts/space-grotesk-latin-var.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/app/app.css" />
</head>
<body>
  <div id="root">
    <div style="display:grid;place-items:center;min-height:100vh">
      <span class="spin" aria-label="Loading"></span>
    </div>
  </div>
  <div class="toast-host" id="toasts" aria-live="polite"></div>
  <script src="/app/app.js"></script>
</body>
</html>
